name: Build and check Space Sense

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet run --project tests/SpaceSense.Checks --configuration Release

  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build SpaceSense.slnx --configuration Release
      - run: dotnet run --project tests/SpaceSense.Checks --configuration Release --no-build
      - run: dotnet publish src/SpaceSense.Desktop --configuration Release --runtime win-x64 --self-contained true --output artifacts/SpaceSense-win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: SpaceSense-Windows-x64-preview
          path: artifacts/SpaceSense-win-x64/
          if-no-files-found: error
